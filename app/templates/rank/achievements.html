{% extends 'base.html' %}
{% block title %}Achievements{% endblock %}
{% block content %}
<h2>🎖️ Achievements</h2>
<div class="ach-grid">
{% for a in all_ach %}
  <div class="ach-badge {{ 'earned' if a.id in earned else 'locked' }}" title="{{ a.descr }}">
    <div class="ach-icon">{{ '🏅' if a.id in earned else '🔒' }}</div>
    <div class="ach-name">{{ a.name }}</div>
    <div class="ach-descr muted small">{{ a.descr }}</div>
  </div>
{% endfor %}
</div>
<p class="muted" style="margin-top:12px">{{ earned|length }}/{{ all_ach|length }} earned</p>
{% endblock %}
