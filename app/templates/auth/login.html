{% extends 'base.html' %}
{% block title %}Login – Syndicate Streets{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>⚔️ Syndicate Streets</h1>
  <p class="tagline">{{ t('Enter the underworld. Respect is everything.') }}</p>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('Username') }}</label>
    <input type="text" name="username" required autofocus autocomplete="username">
    <label>{{ t('Password') }}</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary">{{ t('Enter the Streets') }}</button>
  </form>
  <p class="auth-link">{{ t('No account?') }} <a href="{{ url_for('auth.register') }}">{{ t('Register here') }}</a></p>
</div>
{% endblock %}
