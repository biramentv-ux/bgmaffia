{% extends 'base.html' %}
{% block title %}{{ t('Chat') }}{% endblock %}
{% block content %}
<h2>💬 {{ t('Global Chat') }}</h2>
<div id="chat-box" class="chat-box">
{% for m in messages %}
  <div class="chat-msg">
    <span class="chat-time muted">{{ m.ts[11:16] }}</span>
    <a class="chat-user" href="{{ url_for('home.profile', uid=m.user_id) }}">{{ m.username }}</a>:
    <span class="chat-body">{{ m.body }}</span>
  </div>
{% endfor %}
</div>

<form id="chat-form" method="post" action="{{ url_for('social.chat_send') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="chat-input-row">
    <input type="text" name="body" id="chat-input" placeholder="{{ t('Say something...') }}" maxlength="200" required autocomplete="off">
    <button type="submit" class="btn btn-primary">{{ t('Send') }}</button>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
(function(){
  const box = document.getElementById('chat-box');
  let lastId = {{ (messages[-1].id if messages else 0) }};
  box.scrollTop = box.scrollHeight;
  function pollChat() {
    fetch('/chat/poll?since=' + lastId)
      .then(r => r.json())
      .then(msgs => {
        msgs.forEach(m => {
          lastId = m.id;
          const div = document.createElement('div');
          div.className = 'chat-msg';
          div.innerHTML = `<span class="chat-time muted">${m.ts.substring(11,16)}</span> <a class="chat-user" href="/profile/${m.user_id}">${m.username}</a>: <span class="chat-body">${m.body}</span>`;
          box.appendChild(div);
        });
        if (msgs.length) box.scrollTop = box.scrollHeight;
      });
  }
  setInterval(pollChat, 4000);
})();
</script>
{% endblock %}
