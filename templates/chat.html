{% extends "base.html" %}
{% block content %}
<div class="page-head"><h1>The Wire</h1><p>Live street chatter. Refreshes every few seconds.</p></div>
<div class="panel">
  <div id="chat-log" class="chat-log"></div>
  <form id="chat-form" class="inline-form" style="margin:0">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input name="body" placeholder="Say something..." maxlength="300" autocomplete="off" style="flex:1">
    <button class="btn">Send</button>
  </form>
</div>
{% endblock %}
